name: Release preflight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable commit SHA or annotated tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run ci
      - run: pnpm run package:dry-run
      - run: pnpm run release:metadata -- --output artifacts/release-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ github.sha }}
          path: artifacts/release-preflight/
          if-no-files-found: error
          retention-days: 30
