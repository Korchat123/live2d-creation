<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Production-level interactive Live2D anime character studio and composer">
    <title>Live2D Anime Studio</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">★</span>
          <span>
            <strong>Live2D Anime Studio</strong>
            <small>Interactive Character Composer</small>
          </span>
        </div>
        
        <div class="preset-bar" aria-label="Character Presets">
          <span class="preset-label">Presets:</span>
          <button class="preset-btn" data-preset="idol">Idol Girl</button>
          <button class="preset-btn" data-preset="heroine">Shonen Hero</button>
          <button class="preset-btn" data-preset="gothic">Gothic Lolita</button>
          <button class="preset-btn" data-preset="cyber">Cyberpunk</button>
        </div>

        <div class="top-actions">
          <span class="draft-state" id="save-status">Ready</span>
          <button class="button" id="save-draft">Save Preset</button>
          <button class="button" id="load-draft">Load Preset</button>
          <div class="export-dropdown">
            <button class="button primary" id="export-btn">Export Studio ▼</button>
            <div class="export-menu" id="export-menu" hidden>
              <button data-export="png">📷 Export High-Res PNG</button>
              <button data-export="manifest">📄 Export Live2D JSON</button>
              <button data-export="preset">💾 Save Preset File</button>
            </div>
          </div>
        </div>
      </header>

      <section class="workspace" aria-label="Character studio workspace">
        <nav class="category-rail" aria-label="Part categories">
          <div class="category-list" id="category-list"></div>
        </nav>

        <aside class="parts-panel">
          <div class="panel-heading">
            <h1 id="category-title">Base</h1>
            <span id="collection-hint">Choose one</span>
          </div>
          <input class="search" id="parts-search" type="search" placeholder="Search parts catalog..." aria-label="Search parts">
          <div class="gender-filter" id="gender-filter" aria-label="Filter anatomy by gender" hidden>
            <button data-gender="all" aria-pressed="true">All</button>
            <button data-gender="female" aria-pressed="false">Female</button>
            <button data-gender="male" aria-pressed="false">Male</button>
            <button data-gender="androgynous" aria-pressed="false">Androgynous</button>
          </div>
          <div class="parts-grid" id="parts-grid"></div>
        </aside>

        <section class="stage" aria-label="Interactive Live2D Stage">
          <!-- Animation & Interactive Controls Toolbar -->
          <div class="animation-toolbar" aria-label="Live2D Animation Controls">
            <div class="tool-group">
              <button id="toggle-anim" class="tool-btn is-active" title="Toggle Motion Physics">⏸ Motion</button>
              <button id="toggle-gaze" class="tool-btn is-active" title="Toggle Mouse Eye Tracking">👀 Gaze</button>
              <button id="toggle-pose" class="tool-btn" title="Toggle Pose (Natural / T-Pose)">🧍 Pose</button>
            </div>

            <div class="tool-group">
              <label for="expr-select" class="sr-only">Expression</label>
              <select id="expr-select" class="tool-select" title="Live Expression Trigger">
                <option value="neutral">Smile (Neutral)</option>
                <option value="happy">Happy 😊</option>
                <option value="wink">Wink 😉</option>
                <option value="surprised">Surprised 😮</option>
                <option value="shy">Shy / Blush 😳</option>
                <option value="angry">Angry 😤</option>
              </select>

              <label for="bg-select" class="sr-only">Backdrop</label>
              <select id="bg-select" class="tool-select" title="Studio Backdrop Stage">
                <option value="studio">Studio Light</option>
                <option value="classroom">Classroom Day</option>
                <option value="sunset">Golden Sunset</option>
                <option value="cyberpunk">Cyberpunk Neon</option>
                <option value="transparent">Transparent BG</option>
              </select>
            </div>
          </div>

          <!-- Stage Zoom Controls -->
          <div class="stage-tools" aria-label="Preview Zoom Controls">
            <button id="zoom-out" aria-label="Zoom out">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" aria-label="Zoom in">+</button>
            <button id="reset-view" aria-label="Reset preview">↺</button>
          </div>

          <!-- Canvas Live2D Stage & DOM Fallback Layer -->
          <div class="stage-viewport">
            <canvas id="live2d-stage" width="2048" height="2048"></canvas>
            <div class="character" id="character" aria-label="Japanese anime character fallback"></div>
          </div>
        </section>

        <aside class="inspector">
          <h2 id="inspector-title">Base adjustments</h2>
          <p id="inspector-description">Adjust the selected face safely.</p>
          <div class="context-controls" id="context-controls"></div>
          <h3 class="layer-heading">Current layers</h3>
          <div class="inspector-list" id="inspector-list"></div>
        </aside>
      </section>

      <footer class="statusbar">
        <div class="status-group">
          <span id="selection-count">7 parts selected</span>
          <span class="compatible">Live Physics Active</span>
        </div>
        <div class="status-group">
          <span>60 FPS Live2D Engine</span>
          <span class="status-badge">Production Ready</span>
        </div>
      </footer>
    </main>

    <!-- Hidden file input for loading presets -->
    <input type="file" id="preset-file-input" accept=".json" style="display: none;">

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
