name: Phase D avatar checks

on:
  pull_request:
    paths:
      - ".github/workflows/phase-d-avatar-check.yml"
      - "assets/reference-avatar/**"
      - "assets/fixtures/minimal-avatar/**"
      - "packages/audio/**"
      - "packages/core/**"
      - "packages/renderer-pixi/**"
      - "packages/runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-d-avatar-check.yml"
      - "assets/reference-avatar/**"
      - "assets/fixtures/minimal-avatar/**"
      - "packages/audio/**"
      - "packages/core/**"
      - "packages/renderer-pixi/**"
      - "packages/runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rights:check
      - run: pnpm --filter @open-avatar/core test
      - run: pnpm --filter @open-avatar/audio test
      - run: pnpm --filter @open-avatar/runtime test
      - uses: actions/upload-artifact@v4
        with:
          name: phase-d-authored-inputs-${{ github.sha }}
          path: |
            assets/reference-avatar/animation-clips.json
            assets/reference-avatar/LICENSES/rights.json
            assets/fixtures/minimal-avatar/avatar.json
          if-no-files-found: error
          retention-days: 14
