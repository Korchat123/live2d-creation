name: Phase C package check

on:
  pull_request:
    paths:
      - ".github/workflows/phase-c-package-check.yml"
      - "packages/controls/**"
      - "packages/core/**"
      - "packages/runtime/**"
      - "packages/schema/**"
      - "packages/validator/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase-c-package-check.yml"
      - "packages/controls/**"
      - "packages/core/**"
      - "packages/runtime/**"
      - "packages/schema/**"
      - "packages/validator/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run accumulated repository checks
        run: pnpm run ci
      - name: Pack Phase C packages
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/open-avatar-packages"
          mkdir -p "$artifact_dir"
          for package_name in schema core controls runtime validator; do
            pnpm --dir "packages/$package_name" pack --pack-destination "$artifact_dir"
          done
      - name: Install packages in a clean consumer fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/open-avatar-consumer"
          mkdir -p "$fixture_dir"
          cd "$fixture_dir"
          ARCHIVE_DIR="$RUNNER_TEMP/open-avatar-packages" node --input-type=module -e \
            "import { readdirSync, writeFileSync } from 'node:fs'; import { join } from 'node:path'; const archiveDirectory = process.env.ARCHIVE_DIR; const dependencies = Object.fromEntries(readdirSync(archiveDirectory).filter((file) => file.endsWith('.tgz')).map((file) => ['@open-avatar/' + file.match(/^open-avatar-(schema|core|controls|runtime|validator)-/)[1], 'file:' + join(archiveDirectory, file)])); writeFileSync('package.json', JSON.stringify({ name: 'open-avatar-consumer-check', private: true, type: 'module', dependencies }, null, 2) + '\n'); writeFileSync('pnpm-workspace.yaml', 'overrides:\n' + Object.entries(dependencies).map(([name, reference]) => '  ' + JSON.stringify(name) + ': ' + JSON.stringify(reference)).join('\n') + '\n')"
          pnpm install --ignore-scripts
          node --input-type=module -e \
            "await Promise.all(['@open-avatar/schema', '@open-avatar/core', '@open-avatar/controls', '@open-avatar/runtime', '@open-avatar/validator'].map((name) => import(name)))"
      - name: Upload immutable package candidates
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-packages-${{ github.sha }}
          path: ${{ runner.temp }}/open-avatar-packages/*.tgz
          if-no-files-found: error
          retention-days: 14
